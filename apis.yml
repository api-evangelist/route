aid: route
name: Route
description: 'Route is a post-purchase platform for e-commerce brands that helps merchants
  own the customer experience after checkout. Its core products are package protection
  (shipping insurance covering lost, stolen, or damaged orders), AI-driven returns that
  reduce refunds and returns fraud, and real-time order and package tracking for shoppers.
  Route serves both merchants and their customers through storefront widgets, a mobile
  app, and a developer API documented on Stoplight. The company is backed by Craft Ventures.'
